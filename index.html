<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Peta Pantai Carolina Padang</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body { margin: 0; }
        #map { height: 100vh; }

        .leaflet-control-zoom a {
            width: 50px;
            height: 50px;
            font-size: 24px;
        }
    </style>
</head>

<body>
<div id="map"></div>

<script>
    // =========================
    // KOORDINAT PANTAI CAROLINA
    // =========================
    var lokasi = [-1.0497, 100.3680];

    // MAP
    var map = L.map('map', {
        zoomControl: false
    }).setView(lokasi, 14);

    // ZOOM
    L.control.zoom({ position: 'topleft' }).addTo(map);

    // BASEMAP
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
    }).addTo(map);

    // =========================
    // ICON IKAN
    // =========================
    var iconIkan = L.divIcon({
        html: `<i class="fa-solid fa-fish" 
                style="
                    color:#0096c7;
                    font-size:70px;
                    text-shadow: 2px 2px 6px rgba(0,0,0,0.4);
                ">
              </i>`,
        className: '',
        iconSize: [70, 70],
        iconAnchor: [35, 70]
    });

    // =========================
    // MARKER
    // =========================
    L.marker(lokasi, {icon: iconIkan}).addTo(map);

</script>

</body>
</html>
